name: 免费额度数据端点

# 两条触发路径：
#   1. 每天早上 9 点（北京时间）自动重建一次 —— 刷新 OpenRouter 实时零价模型榜；
#   2. 改了 data/ 或 scripts/ 推上来立刻重建 —— 人工核实的数据改动不等定时器。
# 产物是 site/ 目录（纯静态），发布到 GitHub Pages；接入 EdgeOne / Cloudflare Pages
# 也认这个目录，两边可以同时用。

on:
  schedule:
    - cron: '0 1 * * *' # UTC 01:00 = 北京 09:00
  push:
    branches: [master, main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/free-tier.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 坏数据进不了线上：结构、URL、平台名重复都会在这里拦下
      - name: 数据体检
        run: node scripts/validate-data.mjs

      # OpenRouter 拉失败不阻断：models 落成空数组 + warnings，静态清单照常上线
      - name: 导出静态端点
        run: node scripts/export-free-tier.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
